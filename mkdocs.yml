site_name: get_MNV
site_description: >-
  Codon-level Multi-Nucleotide Variant detection and indel annotation
  from VCF or iVar TSV. Pure Rust, no C dependencies.
site_author: Paula Ruiz-Rodriguez
# Update site_url to wherever the built site is published.
site_url: https://pathogenomics-lab.github.io/get_MNV/

repo_url: https://github.com/PathoGenOmics-Lab/get_MNV
repo_name: PathoGenOmics-Lab/get_MNV
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; Paula Ruiz-Rodriguez & Mireia Coscolla —
  I&sup2;SysBio, University of Valencia-CSIC

theme:
  name: material
  logo: assets/get_mnv.svg
  favicon: assets/get_mnv.png
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    # Render the four groups as always-open headers. The whole map fits in the
    # sidebar at once, so no page is hidden behind a collapsed parent.
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          site_name: get_MNV
          nav_translations:
            Home: Inicio
            # Section names
            Get started: Empezar
            Reference: Referencia
            How it works: Cómo funciona
            Help: Ayuda
            # Pages
            Command Line Tutorial: Tutorial de línea de comandos
            Common Recipes: Recetas habituales
            Desktop GUI: GUI de escritorio
            Desktop GUI Tutorial: Tutorial de la GUI
            CLI Reference: Referencia de CLI
            Input Formats: Formatos de entrada
            Output Formats: Formatos de salida
            Scope and Compatibility: Alcance y compatibilidad
            Indels and Local Haplotypes: Indels y haplotipos locales
            Linkage: Ligamiento
            Benchmarking: Rendimiento
            Glossary: Glosario
            Troubleshooting: Resolución de problemas
            FAQ: Preguntas frecuentes

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PathoGenOmics-Lab/get_MNV
      name: get_MNV on GitHub

# Under `mkdocs build --strict`, which is what CI runs, these turn a link to a
# page or a heading that does not exist into a failure. Renaming a section is
# then caught here instead of by a reader hitting a dead anchor.
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

# Four groups, in the order a reader meets them: run it, look something up,
# understand what it did, get unstuck. Every entry title matches the page's own
# H1, so the sidebar and the page agree; `linkage.md` keeps a longer H1 and is
# listed under its short name.
nav:
  - Home: index.md
  - Get started:
      - Command Line Tutorial: getting-started.md
      - Common Recipes: usage.md
      - Desktop GUI: gui.md
      - Desktop GUI Tutorial: gui-tutorial.md
  - Reference:
      - CLI Reference: cli-reference.md
      - Input Formats: input-formats.md
      - Output Formats: output-formats.md
  - How it works:
      - Scope and Compatibility: indel-mnv-semantics.md
      - Indels and Local Haplotypes: indel-haplotypes.md
      - Linkage: linkage.md
      - Benchmarking: benchmarking.md
  - Help:
      - Glossary: glossary.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
