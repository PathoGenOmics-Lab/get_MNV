[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "get_mnv"
version = "1.1.5"
edition = "2021"
license = "AGPL-3.0-only"
default-run = "get_mnv"

[[bin]]
name = "get_mnv"
path = "src/main.rs"

[dev-dependencies]
# Property tests: the strand-symmetry and codon-bounds invariants are checked
# over generated gene shapes rather than the handful of coordinates a person
# thinks to write down.
proptest = "1"

[dependencies]
clap = { version = "4.5.30", features = ["derive"] }
env_logger = "0.11.6"
log = "0.4.26"
linear-map = "1.2.0"
noodles = { version = "0.115", features = ["bam", "bcf", "bgzf", "vcf", "csi", "tabix", "sam", "core"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
csv = "1.3.1"
lru = "0.18"
rayon = "1.8"
sha2 = "0.11"

# Release profile tuned for production builds. LTO + a single codegen unit
# inline across module/crate boundaries (hot paths: CIGAR walks, allele
# decomposition, codon translation). `panic` is left at the default so the
# Tauri GUI member builds unchanged.
[profile.release]
lto = "thin"
codegen-units = 1
