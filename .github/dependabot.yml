# Dependency updates.
#
# A configuration lived here before and was removed, because it opened one pull
# request per dependency and led with major bumps: five arrived in a single day,
# `bio` 2.3.0 to 3.0.0 and `rust-htslib` 0.49 to 1.0.0 among them, and all five
# were closed. Nothing about that was wrong except the shape of it. This one
# keeps the updates and drops the noise:
#
#   * monthly, not weekly
#   * grouped, so one pull request carries a whole ecosystem's routine bumps
#   * majors kept apart, in their own single pull request, because those are the
#     ones that change APIs and want a person
#
# The minor and patch group is merged automatically once CI passes; see
# .github/workflows/dependabot-auto-merge.yml. The major group never is.
#
# `schedule` here is Dependabot's own timer, not a cron in GitHub Actions: no
# workflow runs on a schedule in this repository.
#
# Security updates are a separate mechanism, enabled in the repository settings,
# and are unaffected by any of this: a vulnerable dependency still gets its own
# pull request the day the advisory lands, major or not.

version: 2

updates:
  # The Rust workspace: the CLI at the root and the desktop crate under
  # src-tauri, which share one lockfile.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "cargo"
    groups:
      cargo-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]

  # The desktop app's frontend.
  #
  # The groups below are ordered on purpose: a dependency joins the first group
  # whose patterns it matches, so the families come before the catch-alls.
  #
  # Splitting by update type alone produced two pull requests that could not
  # both be right. `eslint` 9 to 10 went in the major group, while the bump to
  # `eslint-plugin-react-hooks` that added `^10.0.0` to its peer range was a
  # patch and went in the routine group. The major one then failed at `npm ci`
  # with ERESOLVE against a peer range only the other pull request widened, and
  # neither could be judged without the other.
  #
  # These families were read from the registry rather than guessed, by asking
  # each installed version for its `peerDependencies`:
  #
  #   eslint          <- eslint-plugin-react-hooks, eslint-plugin-react-refresh,
  #                      typescript-eslint
  #   typescript      <- typescript-eslint      (so it joins the same family)
  #   react           <- react-dom
  #   @types/react    <- @types/react-dom
  #   vite            <- @vitejs/plugin-react
  #   @types/node     <- vite                   (so it joins the vite family)
  #
  # `@eslint/js` and `globals` declare no peer range but are the other half of
  # the flat config, and are grouped by association rather than by a constraint.
  #
  # A family carries whatever update types it has to, because that is the whole
  # point: the constraint is between the packages, not between their version
  # numbers. What keeps a major from merging itself is the auto-merge workflow,
  # which reads the highest semver change in the pull request.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "npm"
    groups:
      npm-lint-and-types:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "eslint-config-*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
      npm-react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      npm-vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "@types/node"
      npm-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  # The documentation site's build dependencies.
  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["dependencies", "documentation"]
    commit-message:
      prefix: "docs"
    groups:
      docs-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docs-major:
        patterns: ["*"]
        update-types: ["major"]

  # The actions the workflows themselves pin. These go stale silently: a
  # deprecated runner image or a Node version dropped from an action is only
  # noticed when a job starts warning, or fails.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "actions"
    groups:
      actions-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
