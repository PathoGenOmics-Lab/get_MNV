name: Build & Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            rust_target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
            args: "--target aarch64-apple-darwin"
          - platform: macos-15
            rust_target: x86_64-apple-darwin
            asset_suffix: macos-x86_64
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
            args: "--target x86_64-unknown-linux-gnu"
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            asset_suffix: windows-x86_64
            args: "--target x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup Python (Windows only)
        if: matrix.platform == 'windows-latest'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate Windows .ico
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          $py = @(
            'from PIL import Image',
            'from pathlib import Path',
            'png = Path("src-tauri/icons/icon.png")',
            'ico = Path("src-tauri/icons/icon.ico")',
            'if not png.exists(): raise SystemExit(f"Missing {png}")',
            'ico.parent.mkdir(parents=True, exist_ok=True)',
            'img = Image.open(png).convert("RGBA")',
            'sizes = [(16,16),(24,24),(32,32),(48,48),(64,64),(256,256)]',
            'img.save(ico, format="ICO", sizes=sizes)',
            'print(f"Generated {ico}")'
          )
          $py | Set-Content -Encoding utf8 gen_ico.py
          python gen_ico.py
          $confPath = "src-tauri/tauri.conf.json"
          $json = Get-Content $confPath -Raw | ConvertFrom-Json
          if (-not $json.bundle.icon) { $json.bundle.icon = @() }
          if ($json.bundle.icon -notcontains "icons/icon.ico") {
            $json.bundle.icon += "icons/icon.ico"
          }
          $json | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $confPath

      - name: Build CLI binary
        run: cargo build --release --locked --target ${{ matrix.rust_target }} --bin get_mnv

      - name: Package CLI binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/get_MNV_${{ github.ref_name }}_${{ matrix.asset_suffix }}_cli"
          mkdir -p "$package_dir"
          cp "target/${{ matrix.rust_target }}/release/get_mnv" "$package_dir/get_mnv"
          cp README.md CHANGELOG.md LICENSE "$package_dir/"
          tar -C dist -czf "${package_dir}.tar.gz" "$(basename "$package_dir")"

      - name: Package CLI binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "dist/get_MNV_${{ github.ref_name }}_${{ matrix.asset_suffix }}_cli"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "target/${{ matrix.rust_target }}/release/get_mnv.exe" "$packageDir/get_mnv.exe"
          Copy-Item README.md, CHANGELOG.md, LICENSE -Destination $packageDir
          Compress-Archive -Path $packageDir -DestinationPath "$packageDir.zip" -Force

      - name: Install and build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build and Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc sign on macOS: changes "damaged" → "unidentified developer" (right-click → Open works)
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "get_MNV ${{ github.ref_name }}"
          # No release notes here. They were a fixed paragraph that described one
          # particular release ("refreshes security-sensitive Rust and frontend
          # dependencies for the 1.1.5 release line") and would have been a false
          # description of every release after it. The `finalize` job below writes
          # the notes once, from the tag, and overwrites whatever ends up here.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          args: ${{ matrix.args }}

      - name: Upload CLI binary to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "get_MNV ${{ github.ref_name }}"
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist/*_cli.tar.gz
            dist/*_cli.zip

  # crates.io, from the tag, so it cannot fall behind.
  #
  # Publishing by hand is how a channel goes stale: bioconda sat on 1.1.4 while
  # this repository was on 1.1.5, and the Zenodo record still says 1.0.0. A
  # channel that publishes itself from the tag has no step anyone can forget.
  #
  # It waits for the whole build matrix. If a platform failed, the release is not
  # a release, and a crates.io version is permanent: `cargo yank` hides it from
  # resolution and nothing ever deletes it. That asymmetry is why this job comes
  # last and refuses more readily than the others.
  #
  # Needs CARGO_REGISTRY_TOKEN in the repository secrets. Without it the job says
  # so and stops, rather than failing with an authentication error that reads
  # like a broken workflow.
  crates:
    name: Publish to crates.io
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Check there is a token to publish with
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "No CARGO_REGISTRY_TOKEN is set, so this release is not going to crates.io." >&2
            echo "Add one under Settings -> Secrets -> Actions to turn this on." >&2
            exit 1
          fi

      # The version in Cargo.toml and the tag are one fact written twice, and
      # crates.io cannot be corrected afterwards: publishing 1.1.5 under a tag
      # that says 1.1.6 is permanent. Compared here rather than trusted.
      - name: The tag and Cargo.toml agree on the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='get_mnv'))")
          if [ "${TAG#v}" != "$manifest" ]; then
            echo "tag says ${TAG#v} and Cargo.toml says $manifest; refusing to publish" >&2
            exit 1
          fi
          echo "both say $manifest"

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p get_mnv --locked

  # Everything above uploads binaries and nothing says what they should contain.
  # A reader who downloads a 40 MB installer has no way to tell a good download
  # from a truncated one, and no way to tell either from a substituted one. This
  # publishes one SHA256SUMS file covering every asset, in the format
  # `sha256sum -c` reads, so checking is one command.
  #
  # It waits on the whole matrix, so the file covers all four platforms or is not
  # written at all: `needs` skips this job if any platform failed, and a
  # checksums file that silently covered three platforms out of four would be
  # worse than none.
  finalize:
    name: Publish checksums, provenance and the release notes
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      # Provenance is signed with the workflow's own short-lived identity, which
      # is what makes the attestation say something a person could not forge by
      # uploading a file.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checksum every asset on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # The release is still a draft at this point. Draft assets are
          # downloadable by an authenticated token, which is what makes this
          # possible before the release is published.
          gh release download "$TAG" --repo "$REPO" --dir release-assets --pattern '*' --clobber

          # On a rerun the previous SHA256SUMS is itself an asset, and would be
          # checksummed into its own successor.
          rm -f release-assets/SHA256SUMS

          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "the release carries no assets: refusing to publish an empty checksums file" >&2
            exit 1
          fi

          # LC_ALL=C so the order of the lines does not depend on the runner's
          # locale, and `--` so a name beginning with a dash stays a name.
          (cd release-assets && LC_ALL=C sha256sum -- * > ../SHA256SUMS)

          # Read the file back and check it against the bytes on disk, rather
          # than trusting that writing it worked.
          (cd release-assets && sha256sum -c ../SHA256SUMS)

          echo "checksummed $count assets"
          cat SHA256SUMS

          gh release upload "$TAG" SHA256SUMS --repo "$REPO" --clobber

      # The checksums say a download arrived intact. They cannot say where the
      # file came from: a checksums file and the file it describes can both be
      # replaced by whoever can write to the release. This signs a statement,
      # with the workflow's own short-lived identity rather than a stored key,
      # that these exact bytes were built by this workflow from this commit.
      #
      # A reader checks it with the assets in hand and nothing else:
      #
      #     gh attestation verify get_MNV_1.1.6_amd64.AppImage \
      #       --repo PathoGenOmics-Lab/get_MNV
      #
      # For a tool that gets cited, that is the difference between "this is the
      # file the page offered me" and "this is what the source says it is".
      - name: Attest that these binaries came from this commit
        uses: actions/attest-build-provenance@v2
        with:
          # The same set the checksums cover: the step above leaves them in
          # release-assets/, with the previous SHA256SUMS already removed.
          subject-path: "release-assets/*"

      # The notes used to be a paragraph typed into this file, describing what
      # one release contained. It outlived that release and would have described
      # every later one wrongly. These notes say only what is true of any
      # release and derive the rest from the tag, so there is nothing to keep in
      # step by hand.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # Cutting a release with nothing written about it in the changelog is
          # a mistake rather than a decision, and the notes below link to that
          # entry. Fail here, where the draft is still unpublished and the entry
          # can be added, rather than link a reader to a version the changelog
          # never mentions.
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}]' entry: refusing to announce a release the changelog does not describe" >&2
            exit 1
          fi

          # Quoted heredoc: the body is written literally, backticks and all,
          # and the two placeholders are filled afterwards. An unquoted one
          # would run the fenced commands instead of printing them.
          cat > NOTES.template <<'MARKDOWN'
          ## get_MNV @TAG@

          Everything that changed in this version is listed in the
          [changelog](https://github.com/@REPO@/blob/@TAG@/CHANGELOG.md), pinned to
          this release. Full documentation lives at
          <https://pathogenomics-lab.github.io/get_MNV/>.

          ### Install

          ```bash
          conda install -c bioconda get_mnv
          ```

          Or take an asset below: the `_cli` archives hold the command line tool,
          and the rest are desktop app installers. On macOS the app is not signed
          with an Apple Developer certificate, so on first launch right-click it,
          choose **Open**, then **Open** again in the dialog.

          ### Check what you downloaded

          `SHA256SUMS` below covers every asset in this release. Download it next
          to the file you took and check the two together:

          ```bash
          sha256sum --ignore-missing -c SHA256SUMS
          ```

          Each file it finds prints `OK`. On macOS, `shasum -a 256
          --ignore-missing -c SHA256SUMS` does the same.

          ### Check where it came from

          That tells you the download arrived intact. This tells you what it is:

          ```bash
          gh attestation verify <the file you downloaded> --repo @REPO@
          ```

          Every binary here is signed with a statement that this workflow built
          it from this repository, at the commit this release was cut from. It
          needs no key of ours and no trust in this page.
          MARKDOWN

          # YAML strips the block's own indentation, so the heredoc arrives at
          # column zero and nothing needs dedenting here. Only the placeholders
          # are left to fill. Plain `sed` into a second file rather than `sed
          # -i`, whose spelling differs between GNU and BSD: this way the step
          # can be run and checked on a laptop, not only on the runner.
          sed "s|@TAG@|${TAG}|g; s|@REPO@|${REPO}|g" NOTES.template > NOTES.md

          if grep -q '@TAG@\|@REPO@' NOTES.md; then
            echo "a placeholder survived into the notes" >&2
            exit 1
          fi

          echo "--- notes ---"
          cat NOTES.md
          echo "-------------"

          # Overwrites whatever created the draft put there, so there is one
          # source for the notes and not two.
          #
          # `--discussion-category` takes effect when the draft is published: a
          # release announces itself in Announcements and has somewhere for
          # people to reply. Releases carry no comments of their own, so until
          # now a version went out and started no conversation anywhere.
          gh release edit "$TAG" --repo "$REPO" \
            --notes-file NOTES.md \
            --discussion-category Announcements
