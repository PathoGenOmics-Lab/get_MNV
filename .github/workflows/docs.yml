name: Docs

# Hand the documentation site to GitHub Pages.
#
# The site is plain HTML: tools/build_docs.py writes it from the markdown in
# docs/ and the pages are committed, so there is nothing to build here beyond
# checking that they still match their markdown and that every link resolves.
# MkDocs and Material went in 1.1.6, ahead of Material's end of life.
#
# Before that, this used to run `mkdocs gh-deploy --force`, which built the site and
# force-pushes it onto a `gh-pages` branch that Pages then served. That stopped
# working the moment the repository's Pages source was switched to GitHub
# Actions: the branch still receives the site and Pages no longer looks at it, so
# the workflow would go on succeeding while the published pages quietly stayed as
# they were. A green deploy that publishes nothing is worse than a failing one.
#
# The site is now uploaded as an artifact and deployed by GitHub's own action,
# which is what the `workflow` source expects. Three things come with that: no
# `gh-pages` branch and no force-push, no git identity to configure, and a real
# deployment in the `github-pages` environment, which records what was published
# and can be rolled back.
#
# Triggers:
#   - push to the default branch touching docs/, tools/build_docs.py or this workflow
#   - manual run (workflow_dispatch)
#
# To look at the site without publishing it, open docs/index.html; it works
# from a clone with no server.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/build_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Read the repository to build it. The deploy job asks for what it needs on its
# own, rather than every step in the file holding the right to publish.
permissions:
  contents: read

# One deployment at a time, and never cancel one halfway: an interrupted publish
# leaves the site in whatever state it reached.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # A link to a page or a heading that does not exist fails here rather
      # than being found by a reader.
      - name: The pages match their markdown
        run: python3 tools/build_docs.py --check
      - name: Every link and anchor resolves
        run: python3 tools/check_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only this job can publish, and only it holds the rights to do so.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
