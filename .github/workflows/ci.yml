name: CI

# Quality gate for get_MNV. Runs on every push and pull request. The Tauri
# desktop GUI crate is checked in its own job, which installs the system
# WebKit/GTK libraries it needs.

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Build · test · clippy · fmt (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy -p get_mnv --all-targets -- -D warnings
      - name: Build
        run: cargo build -p get_mnv --locked
      - name: Test
        run: cargo test -p get_mnv --locked

  gui:
    name: Desktop GUI crate builds and matches the CLI defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WebKit and GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      # The GUI crate was excluded from CI, so it went on failing to compile
      # unnoticed while the engine's Args gained fields, and its defaults drifted
      # away from the CLI's. Checking it here catches both.
      - name: Check the GUI crate
        run: cargo check -p get-mnv-gui --locked
      - name: Test the GUI crate
        run: cargo test -p get-mnv-gui --bins --locked

  scenarios:
    name: End-to-end scenario suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install samtools
        run: sudo apt-get update && sudo apt-get install -y samtools
      - name: Build get_mnv
        run: cargo build -p get_mnv --locked
      - name: Run scenario suite
        # run.py exits non-zero if any scenario FAILs.
        run: python3 tests/scenarios/run.py

  truth:
    name: Synthetic ground-truth validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build get_mnv
        run: cargo build -p get_mnv --release --locked
      - name: Compare against the constructed truth
        # Exits non-zero on any disagreement with the answer the dataset was
        # built with. Covers the codon-level MNVs the differential oracles
        # cannot judge.
        run: python3 tests/truth/run.py

  phasing:
    name: Read-level phasing vs a known mixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install samtools
        run: sudo apt-get update && sudo apt-get install -y samtools
      - name: Build get_mnv
        run: cargo build -p get_mnv --release --locked
      - name: Compare against the mixture the BAM was built with
        # Exits non-zero when a linkage call disagrees with the molecule counts
        # the alignments were constructed from.
        run: python3 tests/phasing/run.py

  pileup:
    name: Read counting vs bcftools mpileup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install samtools and bcftools
        run: sudo apt-get update && sudo apt-get install -y samtools bcftools
      - name: Build get_mnv
        run: cargo build -p get_mnv --release --locked
      - name: Compare depth, support and strand against mpileup
        # Fails on any count that differs and is not explained in the suite.
        run: python3 tests/pileup/run.py

  differential:
    name: Differential annotation vs bcftools csq and SnpEff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install bcftools
        run: sudo apt-get update && sudo apt-get install -y bcftools
      - name: Build get_mnv
        run: cargo build -p get_mnv --release --locked
      - name: Compare against the oracles
        # Fails only on a difference that is not explained in
        # tests/differential/baseline.tsv.
        run: python3 tests/differential/run.py

  audit:
    name: cargo audit (advisory, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit
