# Blank issues stay available. The forms cover the reports that arrive most
# often, but a small tool gets questions that fit no form, and having nowhere to
# put them is worse than an unstructured issue.
blank_issues_enabled: true

contact_links:
  - name: Documentation
    url: https://pathogenomics-lab.github.io/get_MNV/
    about: Tutorials, the CLI reference, the output format, and the glossary.
  - name: Frequently asked questions
    url: https://pathogenomics-lab.github.io/get_MNV/faq/
    about: Worth a look first, particularly for questions about which variants get merged.
  - name: Report a security vulnerability
    url: https://github.com/PathoGenOmics-Lab/get_MNV/security/advisories/new
    about: Please report vulnerabilities privately rather than in a public issue.
