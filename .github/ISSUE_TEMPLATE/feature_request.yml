name: Feature request
description: Suggest something get_MNV should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > If you are not sure whether get_MNV already does this, ask in
        > [Q&A](https://github.com/PathoGenOmics-Lab/get_MNV/discussions/categories/q-a) first. It is a shorter path to an answer than a feature
        > request for something that turns out to be a flag.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >-
        The analysis you are trying to carry out, and where get_MNV stops being
        able to help. Describing the problem rather than the solution usually
        leads somewhere better.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which part this concerns
      options:
        - Command line tool
        - Desktop app
        - HTML report
        - Output formats (TSV, VCF, JSON)
        - Documentation
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: >-
        Any workaround you use now, or another tool that does this. Both help
        judge how the feature should behave.
